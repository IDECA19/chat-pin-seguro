<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat PIN Seguro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: #0a0a0a; 
            color: #fff; 
            min-height: 100vh; 
        }
        .container { max-width: 480px; margin: 0 auto; padding: 16px; }
        .card { 
            background: #1a1a1a; 
            padding: 16px; 
            border-radius: 12px; 
            border: 1px solid #2a2a2a; 
            margin-bottom: 12px; 
        }
        .pin-display { 
            font-size: 1.8em; 
            font-weight: 800; 
            color: #00ff88; 
            letter-spacing: 2px; 
            margin: 8px 0; 
            font-family: 'Courier New', monospace; 
            text-align: center;
        }
        .btn { 
            background: #00ff88; 
            color: #000; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 700; 
            cursor: pointer; 
            width: 100%; 
            margin: 6px 0; 
            transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,255,136,0.3); }
        .btn:active { transform: translateY(0); }
        .btn-secondary { background: #2a2a2a; color: #fff; }
        .btn-secondary:hover { background: #333; }
        .btn-danger { background: #ff3b30; color: #fff; }
        .btn-danger:hover { background: #ff5555; }
        .btn-small { padding: 6px 12px; font-size: 12px; width: auto; }
        .status { 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 600; 
            margin: 10px 0; 
            text-align: center;
        }
        .active { background: rgba(0, 255, 136, 0.15); color: #00ff88; }
        .expired { background: rgba(255, 59, 48, 0.15); color: #ff3b30; }
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 6px 0; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background: #222; 
            color: #fff; 
            font-size: 14px; 
            font-family: inherit;
        }
        input:focus, textarea:focus { outline: none; border-color: #00ff88; }
        .hidden { display: none !important; }
        
        .contacto-item {
            background: #222;
            padding: 14px;
            border-radius: 10px;
            margin: 8px 0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            border: 1px solid transparent;
            position: relative;
        }
        .contacto-item:hover { background: #2a2a2a; border-color: #00ff88; transform: translateX(4px); }
        .contacto-pin { font-family: 'Courier New', monospace; font-weight: bold; color: #00ff88; font-size: 16px; }
        .badge {
            background: #ff3b30;
            color: white;
            border-radius: 10px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }
        
        .mensaje {
            background: #222;
            padding: 10px 14px;
            border-radius: 16px;
            margin: 6px 0;
            max-width: 85%;
            word-wrap: break-word;
            animation: slideIn 0.3s ease-out;
            position: relative;
            user-select: none;
        }
        .mensaje.seleccionado {
            border: 2px solid #007aff;
            background: rgba(0, 122, 255, 0.1);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .mensaje-enviado {
            background: #00ff88;
            color: #000;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .mensaje-recibido {
            background: #2a2a2a;
            color: #fff;
            border-bottom-left-radius: 4px;
        }
        .mensaje-meta {
            font-size: 10px;
            margin-top: 4px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
        }
        .mensaje-enviado .mensaje-meta { color: rgba(0,0,0,0.7); }
        .mensaje-recibido .mensaje-meta { color: #888; }
        .check-leido { color: #007aff !important; font-weight: bold; }
        
        .chat-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2a2a;
        }
        .chat-messages {
            max-height: 420px;
            overflow-y: auto;
            padding: 10px 4px;
            scroll-behavior: smooth;
        }
        .mensaje img, .mensaje video {
            max-width: 220px;
            border-radius: 8px;
            margin-top: 4px;
            display: block;
        }
        .mensaje a {
            color: inherit;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            padding: 6px 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
        }
        .archivo-preview {
            background: #222;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid #333;
        }
        .archivo-preview img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 8px;
            margin-top: 8px;
        }
        .progress-bar {
            background: #333;
            height: 4px;
            margin-top: 10px;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: #00ff88;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .encryption-badge {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0,255,136,0.3);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #00ff88;
            margin-top: 10px;
            text-align: center;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .fecha-separador {
            text-align: center;
            color: #666;
            font-size: 11px;
            margin: 16px 0 8px 0;
            position: relative;
        }
        .fecha-separador span {
            background: #1a1a1a;
            padding: 0 12px;
            position: relative;
            z-index: 1;
        }
        .fecha-separador::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #333;
            z-index: 0;
        }
        
        .notif-banner {
            background: rgba(0, 122, 255, 0.15);
            border: 1px solid rgba(0, 122, 255, 0.4);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }
        .notif-banner button {
            background: #007aff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .menu-contextual {
            position: fixed;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 8px 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            min-width: 180px;
        }
        .menu-contextual button {
            background: none;
            border: none;
            color: #fff;
            padding: 10px 16px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .menu-contextual button:hover { background: #333; }
        .menu-contextual button.danger { color: #ff3b30; }
        .menu-contextual button.danger:hover { background: rgba(255, 59, 48, 0.1); }
        
        .barra-seleccion {
            background: #007aff;
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .barra-seleccion button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 6px;
        }
        .barra-seleccion button:hover { background: rgba(255,255,255,0.3); }
        .barra-seleccion button.danger { background: #ff3b30; }
        
        h2 { margin: 0 0 8px 0; font-size: 22px; }
        h3 { margin: 12px 0 8px 0; color: #888; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body>

<div class="container">
    <div id="pantallaInicio">
        <h2>🔒 Chat Anónimo</h2>
        <p style="color: #888; font-size: 13px; margin-bottom: 12px;">Tu PIN es tu identidad</p>
        
        <div class="card">
            <p style="color: #888; margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;">Tu PIN</p>
            <div class="pin-display" id="miPin">...</div>
            <button class="btn btn-secondary" onclick="copiarPIN()">📋 Copiar mi PIN</button>
        </div>

        <div class="card">
            <div id="estadoTexto" class="status expired">Cargando...</div>
            
            <div id="formActivacion" class="hidden">
                <p style="color: #ccc; margin: 10px 0; font-size: 13px;">Código de Activación:</p>
                <input type="text" id="codigoInput" placeholder="Ej: ACT-45D-XXXX" maxlength="20">
                <button class="btn" onclick="activar()" id="btnActivar">Activar</button>
            </div>
            
            <div id="panelChat" class="hidden">
                <button class="btn" onclick="mostrarContactos()">💬 Ir al Chat</button>
                <p style="font-size: 12px; color: #888; margin-top: 10px; text-align: center;">
                    Vence: <span id="fechaVencimiento" style="color: #fff;"></span>
                </p>
                <div style="text-align: center;">
                    <span class="encryption-badge">🔐 Cifrado Híbrido AES+RSA</span>
                </div>
                
                <div id="notifBanner" class="notif-banner hidden">
                    <span>🔔 Activa notificaciones</span>
                    <button onclick="pedirPermisoNotificaciones()">Activar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="pantallaContactos" class="hidden">
        <div class="chat-header">
            <button class="btn btn-secondary" onclick="mostrarInicio()" style="width: auto; padding: 8px 14px; margin: 0;">← Volver</button>
            <h2 style="margin: 0; flex: 1; font-size: 20px;">Mis Contactos</h2>
        </div>

        <div class="card">
            <h3>Agregar nuevo contacto</h3>
            <input type="text" id="nuevoContactoPin" placeholder="PIN del contacto (8 caracteres)" maxlength="8">
            <button class="btn" onclick="agregarContacto()">➕ Agregar</button>

    </div>

    <div id="pantallaChat" class="hidden">
        <div class="chat-header">
            <button class="btn btn-secondary" onclick="mostrarContactos()" style="width: auto; padding: 8px 14px; margin: 0;">← Volver</button>
            <div style="flex: 1;">
                <h2 style="margin: 0; font-size: 18px;">Chat con <span id="chatContactoPin" style="color: #00ff88;"></span></h2>
                <div id="escribiendoTexto" style="font-size: 11px; color: #00ff88; height: 14px; margin-top: 2px;"></div>
            </div>
            <button class="btn btn-danger btn-small" onclick="mostrarMenuChat()" title="Opciones">⋮</button>
        </div>

        <div id="barraSeleccion" class="barra-seleccion hidden">
            <span id="contadorSeleccion">0 seleccionados</span>
            <div>
                <button onclick="cancelarSeleccion()">Cancelar</button>
                <button class="danger" onclick="borrarSeleccionados()">🗑️ Borrar</button>
            </div>
        </div>

        <div class="card" style="padding: 12px;">
            <div id="chatMensajes" class="chat-messages">
                <p style="color: #888; text-align: center; padding: 20px;">No hay mensajes aún</p>
            </div>
        </div>

        <div class="card">
            <textarea id="nuevoMensaje" placeholder="Escribe tu mensaje..." rows="2" oninput="onEscribiendo()"></textarea>
            
            <input type="file" id="archivoInput" style="display: none;" accept="image/*,video/*,.pdf,.doc,.docx,.txt,.zip">
            
            <div style="display: flex; gap: 8px; margin-top: 8px;">
                <button class="btn btn-secondary" onclick="document.getElementById('archivoInput').click()" style="flex: 1; margin: 0;">
                    📎 Adjuntar

                <button class="btn" onclick="enviarMensaje()" style="flex: 2; margin: 0;">
                    📤 Enviar
                </button>

            <div id="archivoPreview" class="archivo-preview hidden">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="archivoNombre" style="font-size: 12px; color: #ccc;"></span>
                    <button onclick="cancelarArchivo()" style="background: #ff3b30; border: none; color: white; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;">✕</button>

</div>

<div id="menuContextual" class="menu-contextual hidden"></div>

<div id="menuChat" class="menu-contextual hidden">
    <button onclick="seleccionarModo()">☑️ Seleccionar mensajes</button>
    <button onclick="limpiarChatCompleto()" class="danger">🗑️ Limpiar todo el chat</button>
    <button onclick="cerrarMenus()">✕ Cerrar</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    var SUPABASE_URL = 'https://dksmoteiidjpymextrgj.supabase.co';
    var SUPABASE_ANON_KEY = 'sb_publishable_HuXshjcD1Je934lVgBcJtw_5kFSuGzE';
    
    var miPIN = '';
    var clienteSupabase = null;
    var contactoActual = '';
    var canalRealtime = null;
    var canalEscribiendo = null;
    var archivoSeleccionado = null;
    var miClavePrivada = null;
    var miClavePublica = null;
    
    var timeoutEscribiendo = null;
    var estoyEscribiendo = false;
    var modoSeleccion = false;
    var mensajesSeleccionados = [];
    var mensajesNoLeidos = {};

    function mostrarInicio() {
        cancelarSuscripciones();
        document.getElementById('pantallaInicio').classList.remove('hidden');
        document.getElementById('pantallaContactos').classList.add('hidden');
        document.getElementById('pantallaChat').classList.add('hidden');
    }

    function mostrarContactos() {
        cancelarSuscripciones();
        document.getElementById('pantallaInicio').classList.add('hidden');
        document.getElementById('pantallaContactos').classList.remove('hidden');
        document.getElementById('pantallaChat').classList.add('hidden');
        cargarContactos();
        cargarMensajesPendientes();
    }

    function mostrarChat(pinContacto) {
        contactoActual = pinContacto;
        document.getElementById('chatContactoPin').innerText = pinContacto;
        document.getElementById('pantallaInicio').classList.add('hidden');
        document.getElementById('pantallaContactos').classList.add('hidden');
        document.getElementById('pantallaChat').classList.remove('hidden');
        modoSeleccion = false;
        mensajesSeleccionados = [];
        document.getElementById('barraSeleccion').classList.add('hidden');
        cargarMensajes();
        suscribirseAMensajes();
        suscribirseAEscribiendo();
        marcarComoLeidos();
    }

    function generarPIN() {
        var pinGuardado = localStorage.getItem('chat_pin');
        if (pinGuardado) {
            miPIN = pinGuardado;
        } else {
            var bytes = new Uint8Array(4);
            crypto.getRandomValues(bytes);
            miPIN = Array.from(bytes, function(b) { 
                return b.toString(16).padStart(2, '0'); 
            }).join('').toUpperCase();
            localStorage.setItem('chat_pin', miPIN);
        }
        document.getElementById('miPin').innerText = miPIN;
    }

    async function inicializarTodo() {
        try {
            if (typeof supabase === 'undefined') return false;
            clienteSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            await inicializarClaves();
            return true;
        } catch (error) {
            console.error('Error:', error);
            return false;
        }
    }

    async function inicializarClaves() {
        var claveGuardada = localStorage.getItem('clave_privada_' + miPIN);
        if (claveGuardada) await cargarClaves();
        else await generarClaves();
    }

    async function generarClaves() {
        try {
            var parClaves = await crypto.subtle.generateKey(
                { name: "RSA-OAEP", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" },
                true, ["encrypt", "decrypt"]
            );
            miClavePrivada = parClaves.privateKey;
            miClavePublica = parClaves.publicKey;
            var pubExp = await crypto.subtle.exportKey("spki", miClavePublica);
            var pubBase64 = btoa(String.fromCharCode.apply(null, new Uint8Array(pubExp)));
            var privExp = await crypto.subtle.exportKey("pkcs8", miClavePrivada);
            var privBase64 = btoa(String.fromCharCode.apply(null, new Uint8Array(privExp)));
            localStorage.setItem('clave_privada_' + miPIN, privBase64);
            await subirClavePublica(pubBase64);
            console.log('✅ Claves generadas');
        } catch (error) {
            console.error('Error generando claves:', error);
        }
    }

    async function cargarClaves() {
        var privBase64 = localStorage.getItem('clave_privada_' + miPIN);
        if (!privBase64) { await generarClaves(); return; }
        try {
            var privBuf = Uint8Array.from(atob(privBase64), c => c.charCodeAt(0));
            miClavePrivada = await crypto.subtle.importKey("pkcs8", privBuf, { name: "RSA-OAEP", hash: "SHA-256" }, true, ["decrypt"]);
            var { data } = await clienteSupabase.from('usuarios').select('clave_publica').eq('pin', miPIN).single();
            if (data && data.clave_publica) {
                var pubBuf = Uint8Array.from(atob(data.clave_publica), c => c.charCodeAt(0));
                miClavePublica = await crypto.subtle.importKey("spki", pubBuf, { name: "RSA-OAEP", hash: "SHA-256" }, true, ["encrypt"]);
                console.log('✅ Claves cargadas');
            } else {
                await generarClaves();
            }
        } catch (error) {
            console.error('Error cargando claves:', error);
            await generarClaves();
        }
    }

    async function subirClavePublica(pubBase64) {
        if (!clienteSupabase) return;
        var { error } = await clienteSupabase.from('usuarios').upsert({ pin: miPIN, clave_publica: pubBase64 });
        if (error) console.error('Error subiendo clave:', error);
    }

    async function obtenerClavePublica(pin) {
        try {
            var { data, error } = await clienteSupabase.from('usuarios').select('clave_publica').eq('pin', pin).single();
            if (error || !data || !data.clave_publica) return null;
            var buf = Uint8Array.from(atob(data.clave_publica), c => c.charCodeAt(0));
            return await crypto.subtle.importKey("spki", buf, { name: "RSA-OAEP", hash: "SHA-256" }, true, ["encrypt"]);
        } catch (error) { return null; }
    }

    async function generarClaveAES() {
        return await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    }

    async function cifrarConAES(texto, claveAES) {
        var encoder = new TextEncoder();
        var iv = crypto.getRandomValues(new Uint8Array(12));
        var cifrado = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, claveAES, encoder.encode(texto));
        return {
            iv: btoa(String.fromCharCode.apply(null, iv)),
            datos: btoa(String.fromCharCode.apply(null, new Uint8Array(cifrado)))
        };
    }

    async function descifrarConAES(ivBase64, datosBase64, claveAES) {
        var iv = Uint8Array.from(atob(ivBase64), c => c.charCodeAt(0));
        var datos = Uint8Array.from(atob(datosBase64), c => c.charCodeAt(0));
        var descifrado = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, claveAES, datos);
        return new TextDecoder().decode(descifrado);
    }

    async function exportarClaveAES(clave) {
        var raw = await crypto.subtle.exportKey("raw", clave);
        return btoa(String.fromCharCode.apply(null, new Uint8Array(raw)));
    }

    async function importarClaveAES(base64) {
        var raw = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
        return await crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, true, ["encrypt", "decrypt"]);
    }

    async function cifrarClaveConRSA(claveAESBase64, clavePublicaRSA) {
        var encoder = new TextEncoder();
        var cifrado = await crypto.subtle.encrypt({ name: "RSA-OAEP" }, clavePublicaRSA, encoder.encode(claveAESBase64));
        return btoa(String.fromCharCode.apply(null, new Uint8Array(cifrado)));
    }

    async function descifrarClaveConRSA(claveCifradaBase64, clavePrivadaRSA) {
        var cifrado = Uint8Array.from(atob(claveCifradaBase64), c => c.charCodeAt(0));
        var descifrado = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, clavePrivadaRSA, cifrado);
        return new TextDecoder().decode(descifrado);
    }

    async function cifrarMensaje(texto, clavePublicaDestinatario) {
        var claveAES = await generarClaveAES();
        var claveAESBase64 = await exportarClaveAES(claveAES);
        var { iv, datos } = await cifrarConAES(texto, claveAES);
        var claveParaDestinatario = await cifrarClaveConRSA(claveAESBase64, clavePublicaDestinatario);
        var claveParaMi = await cifrarClaveConRSA(claveAESBase64, miClavePublica);
        return iv + '|' + datos + '|' + claveParaDestinatario + '|' + claveParaMi;
    }

    async function descifrarMensaje(cifradoBase64) {
        if (!cifradoBase64 || cifradoBase64.length === 0) return '';
        if (!cifradoBase64.includes('|')) {
            var esBase64 = /^[A-Za-z0-9+/]*={0,2}$/.test(cifradoBase64) && (cifradoBase64.length % 4 === 0);
            if (!esBase64) return cifradoBase64;
            try {
                var buf = Uint8Array.from(atob(cifradoBase64), c => c.charCodeAt(0));
                var desc = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, miClavePrivada, buf);
                return new TextDecoder().decode(desc);
            } catch (e) { return cifradoBase64; }
        }
        try {
            var partes = cifradoBase64.split('|');
            if (partes.length !== 4) return '[Formato inválido]';
            var iv = partes[0], datos = partes[1], claveParaDestinatario = partes[2], claveParaMi = partes[3];
            var claveAESBase64 = null;
            try { claveAESBase64 = await descifrarClaveConRSA(claveParaMi, miClavePrivada); }
            catch (e) { try { claveAESBase64 = await descifrarClaveConRSA(claveParaDestinatario, miClavePrivada); } catch (e2) { return '[No se puede descifrar]'; } }
            var claveAES = await importarClaveAES(claveAESBase64);
            return await descifrarConAES(iv, datos, claveAES);
        } catch (error) {
            console.error('Error descifrando:', error);
            return '[Error al descifrar]';
        }
    }

    async function cifrarArchivo(file, clavePublicaDestinatario) {
        console.log('🔐 Cifrando archivo:', file.name);
        try {
            var claveAES = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
            var arrayBuffer = await file.arrayBuffer();
            var iv = crypto.getRandomValues(new Uint8Array(12));
            var cifrado = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, claveAES, arrayBuffer);
            var claveAESExportada = await crypto.subtle.exportKey("raw", claveAES);
            var claveAESBase64 = btoa(String.fromCharCode.apply(null, new Uint8Array(claveAESExportada)));
            var claveCifradaRSA = await cifrarClaveConRSA(claveAESBase64, clavePublicaDestinatario);
            var claveCifradaRSAMia = await cifrarClaveConRSA(claveAESBase64, miClavePublica);
            var blobCifrado = new Blob([cifrado], { type: 'application/octet-stream' });
            console.log('✅ Archivo cifrado:', file.size, 'bytes →', cifrado.byteLength, 'bytes');
            return {
                blob: blobCifrado,
                iv: btoa(String.fromCharCode.apply(null, iv)),
                claveParaDestinatario: claveCifradaRSA,
                claveParaMi: claveCifradaRSAMia,
                nombreOriginal: file.name,
                tipoOriginal: file.type,
                tamañoOriginal: file.size
            };
        } catch (error) {
            console.error('❌ Error cifrando archivo:', error);
            throw error;
        }
    }

    async function descifrarArchivo(arrayBufferCifrado, ivBase64, claveCifradaBase64) {
        console.log('🔓 Descifrando archivo...');
        try {
            var claveAESBase64 = await descifrarClaveConRSA(claveCifradaBase64, miClavePrivada);
            var claveAESRaw = Uint8Array.from(atob(claveAESBase64), c => c.charCodeAt(0));
            var claveAES = await crypto.subtle.importKey("raw", claveAESRaw, { name: "AES-GCM" }, true, ["decrypt"]);
            var iv = Uint8Array.from(atob(ivBase64), c => c.charCodeAt(0));
            var descifrado = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, claveAES, arrayBufferCifrado);
            console.log('✅ Archivo descifrado correctamente');
            return descifrado;
        } catch (error) {
            console.error('❌ Error descifrando archivo:', error);
            throw new Error('No se pudo descifrar el archivo');
        }
    }

    async function subirArchivo(file, pinDestinatario) {
        try {
            var clavePublicaDest = await obtenerClavePublica(pinDestinatario);
            if (!clavePublicaDest) throw new Error('No se encontró la clave pública del destinatario');
            var archivoCifrado = await cifrarArchivo(file, clavePublicaDest);
            var ts = Date.now();
            var ext = file.name.split('.').pop();
            var fileName = miPIN + '_' + pinDestinatario + '_' + ts + '_ENC.' + ext + '.enc';
            var { data, error } = await clienteSupabase.storage.from('chat-files').upload(fileName, archivoCifrado.blob, { 
                cacheControl: '3600', upsert: false, contentType: 'application/octet-stream' 
            });
            if (error) throw error;
            var { data: urlData } = await clienteSupabase.storage.from('chat-files').createSignedUrl(fileName, 60 * 60 * 24 * 30);
            if (!urlData || !urlData.signedUrl) throw new Error('No se pudo generar la URL del archivo');
            return {
                url: urlData.signedUrl,
                path: data.path,
                nombre: archivoCifrado.nombreOriginal,
                tipo: archivoCifrado.tipoOriginal,
                tamaño: archivoCifrado.tamañoOriginal,
                iv: archivoCifrado.iv,
                claveParaDestinatario: archivoCifrado.claveParaDestinatario,
                claveParaMi: archivoCifrado.claveParaMi,
                cifrado: true
            };
        } catch (error) {
            console.error('❌ Error en subirArchivo:', error);
            throw error;
        }
    }

    function reproducirSonido() {
        try {
            var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            var oscillator = audioCtx.createOscillator();
            var gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.5);
            console.log('🔊 Sonido reproducido');
        } catch (e) { 
            console.log('⚠️ No se pudo reproducir sonido');
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }
    }

    function formatBytes(bytes) {
        if (bytes === 0) return '0 Bytes';
        var k = 1024, sizes = ['Bytes', 'KB', 'MB', 'GB'];
        var i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

        var contenedor = document.getElementById('chatMensajes');
        var tipoMensaje = 'texto';
        var archivoInfo = null;
        var mensajeCifrado = '';
        if (texto) {
            var clavePub = await obtenerClavePublica(contactoActual);
            if (!clavePub) { alert('⚠️ Este contacto no tiene cifrado configurado.'); return; }
            try { mensajeCifrado = await cifrarMensaje(texto, clavePub); } catch (error) { alert('Error al cifrar'); return; }
        }
        if (archivoSeleccionado) {
            try {
                document.getElementById('archivoProgressBar').style.width = '50%';
                archivoInfo = await subirArchivo(archivoSeleccionado, contactoActual);

                    tipo_mensaje: tipoMensaje, archivo_url: archivoInfo.url, archivo_nombre: archivoInfo.nombre,
                    archivo_tamaño: archivoInfo.tamaño, archivo_iv: archivoInfo.iv,
                    archivo_clave: archivoInfo.claveParaMi, archivo_cifrado: archivoInfo.cifrado,
                    texto_descifrado: texto, enviado_en: new Date().toISOString(), leido: false 
                });
                contenedor.appendChild(div);
                contenedor.scrollTop = contenedor.scrollHeight;
            } catch (error) { 
                alert('Error al subir archivo: ' + error.message); 
                document.getElementById('archivoProgressBar').style.width = '0%'; 
                return; 
            }
        }
        try {
            console.log('Guardando mensaje en base de datos...');
            var insertData = {
                pin_remitente: miPIN, pin_destinatario: contactoActual,
                mensaje_cifrado: mensajeCifrado, nonce: 'e2ee', tipo_mensaje: tipoMensaje,
                archivo_url: archivoInfo ? archivoInfo.url : null,
                archivo_nombre: archivoInfo ? archivoInfo.nombre : null,
                archivo_tamaño: archivoInfo ? archivoInfo.tamaño : null,
                archivo_iv: archivoInfo ? archivoInfo.iv : null,

                archivo_cifrado: archivoInfo ? archivoInfo.cifrado : false,

    function renderizarMensajes(mensajes) {
        var contenedor = document.getElementById('chatMensajes');
        var html = '';
        var ultimaFecha = '';
        mensajes.forEach(function(msg) {
            var fechaMsg = new Date(msg.enviado_en);
            var fechaStr = formatearFecha(fechaMsg);
            if (fechaStr !== ultimaFecha) {
                html += '<div class="fecha-separador"><span>' + fechaStr + '</span></div>';
                ultimaFecha = fechaStr;
            }
            html += construirHTMLMensaje(msg);
        });
        contenedor.innerHTML = html;
    }

    function formatearFecha(fecha) {
        var ahora = new Date();
        var hoy = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
        var msgDia = new Date(fecha.getFullYear(), fecha.getMonth(), fecha.getDate());
        var diff = (hoy - msgDia) / (1000 * 60 * 60 * 24);
        if (diff === 0) return 'Hoy';
        if (diff === 1) return 'Ayer';
        if (diff < 7) return fecha.toLocaleDateString('es-ES', { weekday: 'long' });
        return fecha.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });
    }

    function formatearHora(fecha) {
        return fecha.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    }

    function construirHTMLMensaje(msg) {
        var esMio = msg.pin_remitente === miPIN;
        var clase = esMio ? 'mensaje-enviado' : 'mensaje-recibido';
        if (mensajesSeleccionados.includes(msg.id)) clase += ' seleccionado';
        var contenido = '';
        if (msg.archivo_url) {
            if (msg.tipo_mensaje === 'imagen') {
                if (msg.archivo_cifrado) {
                    contenido = '<img src="' + msg.archivo_url + '" onclick="descifrarYMostrarImagen(\'' + msg.id + '\', this)" style="cursor: pointer; max-width: 220px; border-radius: 8px;" data-iv="' + (msg.archivo_iv || '') + '" data-clave="' + (msg.archivo_clave || '') + '" alt="🔐 Clic para descifrar">';
                } else {
                    contenido = '<img src="' + msg.archivo_url + '" onclick="window.open(this.src)" style="cursor: pointer; max-width: 220px; border-radius: 8px;">';
                }
            } else if (msg.tipo_mensaje === 'video') {
                if (msg.archivo_cifrado) {
                    contenido = '<button onclick="descifrarYReproducirVideo(this)" data-src="' + msg.archivo_url + '" data-iv="' + (msg.archivo_iv || '') + '" data-clave="' + (msg.archivo_clave || '') + '" style="background: rgba(0,0,0,0.3); border: none; color: inherit; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;">🎥 Video cifrado - clic para ver</button>';
                } else {
                    contenido = '<video controls style="max-width: 220px; border-radius: 8px;"><source src="' + msg.archivo_url + '"></video>';
                }
            } else if (msg.tipo_mensaje === 'documento') {
                if (msg.archivo_cifrado) {
                    contenido = '<button onclick="descifrarYDescargarArchivo(\'' + msg.archivo_url + '\', \'' + (msg.archivo_clave || '') + '\', \'' + (msg.archivo_iv || '') + '\', \'' + (msg.archivo_nombre || 'archivo') + '\')" style="background: rgba(0,0,0,0.3); border: none; color: inherit; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;"><span>🔐</span> <span>' + (msg.archivo_nombre || 'Archivo') + '</span></button>';
                } else {
                    contenido = '<a href="' + msg.archivo_url + '" target="_blank" style="color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; background: rgba(0,0,0,0.2); border-radius: 6px; margin-top: 4px;">📎 ' + (msg.archivo_nombre || 'Archivo') + '</a>';
                }
            } else {
                if (msg.archivo_cifrado) {
                    contenido = '<button onclick="descifrarYDescargarArchivo(\'' + msg.archivo_url + '\', \'' + (msg.archivo_clave || '') + '\', \'' + (msg.archivo_iv || '') + '\', \'archivo\')" style="background: rgba(0,0,0,0.3); border: none; color: inherit; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;">🔐 Archivo cifrado</button>';
                } else {
                    contenido = '<a href="' + msg.archivo_url + '" target="_blank" style="color: inherit; text-decoration: none;">📎 Archivo</a>';
                }
            }
        }
        if (msg.texto_descifrado && msg.texto_descifrado.length > 0) {
            if (contenido) contenido = '<div style="margin-bottom: 4px;">' + msg.texto_descifrado + '</div>' + contenido;
            else contenido = msg.texto_descifrado;
        }
        if (!contenido) contenido = '<em style="color: #888;">[Archivo]</em>';
        var fechaHora = msg.enviado_en ? formatearHora(new Date(msg.enviado_en)) : '';
        var checks = '';
        if (esMio) {
            if (msg.leido) checks = '<span class="check-leido">✓✓</span>';
            else checks = '<span style="color: #888; font-weight: bold;">✓</span>';
        }
        var onclickAttr = '';
        if (modoSeleccion) onclickAttr = 'onclick="toggleSeleccion(\'' + msg.id + '\')"';
        else if (!msg.archivo_cifrado) onclickAttr = 'oncontextmenu="mostrarMenuMensaje(event, \'' + msg.id + '\')"';
        return '<div class="mensaje ' + clase + '" data-id="' + msg.id + '" ' + onclickAttr + '>' + contenido + '<div class="mensaje-meta">' + fechaHora + (checks ? ' ' + checks : '') + '</div></div>';
    }

    async function descifrarYMostrarImagen(msgId, imgElement) {
        try {
            var iv = imgElement.getAttribute('data-iv');
            var clave = imgElement.getAttribute('data-clave');
            var url = imgElement.src;
            imgElement.style.opacity = '0.5';
            imgElement.alt = 'Descifrando...';
            var response = await fetch(url);
            var arrayBufferCifrado = await response.arrayBuffer();
            var arrayBufferDescifrado = await descifrarArchivo(arrayBufferCifrado, iv, clave);
            var blob = new Blob([arrayBufferDescifrado], { type: 'image/*' });
            var urlDescifrado = URL.createObjectURL(blob);
            imgElement.src = urlDescifrado;
            imgElement.style.opacity = '1';
            imgElement.onclick = function() { window.open(urlDescifrado); };
            console.log('✅ Imagen descifrada');
        } catch (error) {
            console.error('❌ Error descifrando imagen:', error);
            imgElement.alt = 'Error al descifrar';
            imgElement.style.opacity = '1';
            alert('Error al descifrar imagen');
        }
    }

    async function descifrarYReproducirVideo(buttonElement) {
        try {
            var iv = buttonElement.getAttribute('data-iv');
            var clave = buttonElement.getAttribute('data-clave');
            var url = buttonElement.getAttribute('data-src');
            buttonElement.innerText = '⏳ Descifrando...';
            var response = await fetch(url);
            var arrayBufferCifrado = await response.arrayBuffer();
            var arrayBufferDescifrado = await descifrarArchivo(arrayBufferCifrado, iv, clave);
            var blob = new Blob([arrayBufferDescifrado], { type: 'video/*' });
            var urlDescifrado = URL.createObjectURL(blob);
            var video = document.createElement('video');
            video.controls = true;
            video.style.maxWidth = '220px';
            video.style.borderRadius = '8px';
            video.innerHTML = '<source src="' + urlDescifrado + '">';
            buttonElement.parentNode.replaceChild(video, buttonElement);
            video.play();
            console.log('✅ Video descifrado');
        } catch (error) {
            console.error('❌ Error descifrando video:', error);
            alert('Error al descifrar video');
        }
    }

    async function descifrarYDescargarArchivo(url, claveCifradaBase64, ivBase64, nombreOriginal) {
        try {
            var response = await fetch(url);
            var arrayBufferCifrado = await response.arrayBuffer();
            var arrayBufferDescifrado = await descifrarArchivo(arrayBufferCifrado, ivBase64, claveCifradaBase64);
            var blob = new Blob([arrayBufferDescifrado], { type: 'application/octet-stream' });
            var urlDescifrado = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = urlDescifrado;
            a.download = nombreOriginal || 'archivo_descifrado';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function() { URL.revokeObjectURL(urlDescifrado); }, 100);
            console.log('✅ Archivo descargado y descifrado');
        } catch (error) {
            console.error('❌ Error descifrando archivo:', error);
            alert('Error al descifrar archivo: ' + error.message);
        }
    }

    function seleccionarModo() {
        modoSeleccion = true;
        mensajesSeleccionados = [];
        document.getElementById('barraSeleccion').classList.remove('hidden');
        document.getElementById('menuChat').classList.add('hidden');
        cargarMensajes();
    }

    function cancelarSeleccion() {
        modoSeleccion = false;
        mensajesSeleccionados = [];
        document.getElementById('barraSeleccion').classList.add('hidden');
        cargarMensajes();
    }

    function toggleSeleccion(id) {
        var idx = mensajesSeleccionados.indexOf(id);
        if (idx > -1) mensajesSeleccionados.splice(idx, 1);
        else mensajesSeleccionados.push(id);
        document.getElementById('contadorSeleccion').innerText = mensajesSeleccionados.length + ' seleccionado' + (mensajesSeleccionados.length !== 1 ? 's' : '');
        var divs = document.querySelectorAll('.mensaje[data-id="' + id + '"]');
        divs.forEach(function(div) { div.classList.toggle('seleccionado'); });
    }

    async function borrarSeleccionados() {
        if (mensajesSeleccionados.length === 0) { alert('No hay mensajes seleccionados'); return; }
        if (!confirm('¿Borrar ' + mensajesSeleccionados.length + ' mensaje(s)?')) return;
        try {
            var { error } = await clienteSupabase.from('mensajes').delete().in('id', mensajesSeleccionados);
            if (error) throw error;
            alert('✅ Mensajes borrados');
            cancelarSeleccion();
            cargarMensajes();
        } catch (error) { alert('Error al borrar: ' + error.message); }
    }

    async function borrarMensajeIndividual(id) {
        if (!confirm('¿Borrar este mensaje?')) return;
        try {
            var { error } = await clienteSupabase.from('mensajes').delete().eq('id', id);
            if (error) throw error;
            cerrarMenus();
            cargarMensajes();
        } catch (error) { alert('Error al borrar: ' + error.message); }
    }

    async function limpiarChatCompleto() {
        if (!confirm('⚠️ ¿Borrar TODOS los mensajes de este chat?')) return;
        try {
            var { error } = await clienteSupabase.from('mensajes').delete()
                .or('and(pin_remitente.eq.' + miPIN + ',pin_destinatario.eq.' + contactoActual + '),' +
                    'and(pin_remitente.eq.' + contactoActual + ',pin_destinatario.eq.' + miPIN + ')');
            if (error) throw error;
            alert('✅ Chat limpiado');
            cerrarMenus();
            cargarMensajes();
        } catch (error) { alert('Error al limpiar: ' + error.message); }
    }

    function mostrarMenuMensaje(event, id) {
        event.preventDefault();
        var menu = document.getElementById('menuContextual');
        menu.innerHTML = '<button onclick="copiarMensaje(\'' + id + '\')">📋 Copiar texto</button><button onclick="borrarMensajeIndividual(\'' + id + '\')" class="danger">🗑️ Borrar mensaje</button><button onclick="cerrarMenus()">✕ Cerrar</button>';
        menu.style.left = event.clientX + 'px';
        menu.style.top = event.clientY + 'px';
        menu.classList.remove('hidden');
    }

    function copiarMensaje(id) {
        var div = document.querySelector('.mensaje[data-id="' + id + '"]');
        if (div) {
            var texto = div.innerText.replace(/✓✓|✓|\d{2}:\d{2}/g, '').trim();
            navigator.clipboard.writeText(texto).then(() => alert('📋 Copiado'));
        }
        cerrarMenus();
    }

    function mostrarMenuChat() {
        var menu = document.getElementById('menuChat');
        var btn = event.target;
        var rect = btn.getBoundingClientRect();
        menu.style.right = '16px';
        menu.style.top = (rect.bottom + 8) + 'px';
        menu.style.left = 'auto';
        menu.classList.remove('hidden');
    }

    function cerrarMenus() {
        document.getElementById('menuContextual').classList.add('hidden');
        document.getElementById('menuChat').classList.add('hidden');
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.menu-contextual') && !e.target.closest('[onclick*="mostrarMenuChat"]')) {
            cerrarMenus();
        }
    });

    function suscribirseAMensajes() {
        if (!clienteSupabase) return;
        cancelarSuscripcionMensajes();
        canalRealtime = clienteSupabase.channel('mensajes_' + miPIN + '_' + Date.now())
            .on('postgres_changes', {
                event: 'INSERT', schema: 'public', table: 'mensajes',
                filter: 'pin_destinatario=eq.' + miPIN
            }, async function(payload) {
                console.log('🔔 Nuevo mensaje recibido');
                var nuevo = payload.new;
                var texto = '';
                if (nuevo.mensaje_cifrado && nuevo.mensaje_cifrado.length > 0) {
                    texto = await descifrarMensaje(nuevo.mensaje_cifrado);
                }
                mensajesNoLeidos[nuevo.pin_remitente] = (mensajesNoLeidos[nuevo.pin_remitente] || 0) + 1;
                if (document.getElementById('listaContactos')) cargarContactos();
                var cuerpo = nuevo.tipo_mensaje !== 'texto' ? '📎 Archivo adjunto' : (texto.substring(0, 50) || 'Mensaje');
                mostrarNotificacion('Mensaje de ' + nuevo.pin_remitente, cuerpo);
                if (contactoActual === nuevo.pin_remitente) {
                    nuevo.texto_descifrado = texto;
                    var contenedor = document.getElementById('chatMensajes');
                    var sinMensajes = contenedor.querySelector('p');
                    if (sinMensajes) contenedor.innerHTML = '';
                    var div = document.createElement('div');
                    div.innerHTML = construirHTMLMensaje(nuevo);
                    contenedor.appendChild(div.firstChild);
                    contenedor.scrollTop = contenedor.scrollHeight;
                    setTimeout(marcarComoLeidos, 1000);
                }
            })
            .on('postgres_changes', {
                event: 'UPDATE', schema: 'public', table: 'mensajes',
                filter: 'pin_remitente=eq.' + miPIN
            }, function(payload) {
                if (payload.new.leido) {
                    var elementos = document.querySelectorAll('.mensaje-enviado .mensaje-meta');
                    elementos.forEach(function(meta) {
                        var check = meta.querySelector('span:not(.check-leido)');
                        if (check && check.innerText === '✓') {
                            check.className = 'check-leido';
                            check.innerText = '✓✓';
                        }
                    });
                }
            })
            .on('postgres_changes', {
                event: 'DELETE', schema: 'public', table: 'mensajes',
                filter: 'pin_destinatario=eq.' + miPIN
            }, function(payload) {
                if (contactoActual) cargarMensajes();
            })
            .subscribe(function(status) {
                console.log('📡 Suscripción a mensajes:', status);
            });
    }

    function cancelarSuscripcionMensajes() {
        if (canalRealtime) { clienteSupabase.removeChannel(canalRealtime); canalRealtime = null; }
    }
    function cancelarSuscripcionEscribiendo() {
        if (canalEscribiendo) { clienteSupabase.removeChannel(canalEscribiendo); canalEscribiendo = null; }
    }
    function cancelarSuscripciones() {
        cancelarSuscripcionMensajes();
        cancelarSuscripcionEscribiendo();
        var div = document.getElementById('escribiendoTexto');
        if (div) div.innerText = '';
    }

    window.addEventListener('DOMContentLoaded', async function() {
        generarPIN();
        await inicializarTodo();
        await verificarEstado();
    });
</script>
