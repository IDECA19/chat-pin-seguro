// Helper para formatear bytes
function formatBytes(bytes, decimals = 2) {
if (!bytes || bytes === 0) return '0 Bytes';
const k = 1024;
const dm = decimals < 0 ? 0 : decimals;
const sizes = ['Bytes', 'KB', 'MB', 'GB'];
const i = Math.floor(Math.log(bytes) / Math.log(k));
return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
}

// Extrae la ruta de almacenamiento relativa dentro de "chat-files" desde un enlace firmado de Supabase
function obtenerPathDesdeUrl(url) {
if (!url) return null;
try {
if (url.includes('/storage/v1/object/')) {
var match = url.match(/\/chat-files\/([^?]+)/);
if (match && match[1]) {
return decodeURIComponent(match[1]);
}
}
} catch (e) {
logError('Error extrayendo path de url:', e);
}
return null;
}

async function hashPIN(pin) {
var encoder = new TextEncoder();
var data = encoder.encode('pin:' + pin);
var hashBuffer = await crypto.subtle.digest('SHA-256', data);
return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function generarCodigoRecuperacion() {
var caracteres = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var codigo = '';
var bytes = crypto.getRandomValues(new Uint8Array(24));
for (var i = 0; i < 24; i++) codigo += caracteres[bytes[i] % caracteres.length];
return codigo.match(/.{1,4}/g).join('-');
}

async function descifrarClaveConCodigo(claveCifrada, codigo) {
var partes = claveCifrada.split('.');
var salt = Uint8Array.from(atob(partes[0]), c => c.charCodeAt(0));
var iv = Uint8Array.from(atob(partes[1]), c => c.charCodeAt(0));
var cifrado = Uint8Array.from(atob(partes[2]), c => c.charCodeAt(0));
var encoder = new TextEncoder();
var keyMaterial = await crypto.subtle.importKey('raw', encoder.encode('codigo:' + codigo.toUpperCase().replace(/-/g, '')), 'PBKDF2', false, ['deriveKey']);
var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, cifrado));
}
async function cifrarClaveConPIN(clavePrivadaBase64, pin) {
var encoder = new TextEncoder();
var keyMaterial = await crypto.subtle.importKey('raw', encoder.encode('pin:' + pin), 'PBKDF2', false, ['deriveKey']);
var salt = crypto.getRandomValues(new Uint8Array(16));
var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
var iv = crypto.getRandomValues(new Uint8Array(12));
var cifrado = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, encoder.encode(clavePrivadaBase64));
return btoa(String.fromCharCode.apply(null, salt)) + '.' + btoa(String.fromCharCode.apply(null, iv)) + '.' + btoa(String.fromCharCode.apply(null, new Uint8Array(cifrado)));
}
async function descifrarClaveConPIN(claveCifrada, pin) {

async function generarClaves() {
try {
var parClaves = await crypto.subtle.generateKey({ name: "RSA-OAEP", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" }, true, ["encrypt", "decrypt"]);
miClavePrivada = parClaves.privateKey;
miClavePublica = parClaves.publicKey;
var pubExp = await crypto.subtle.exportKey("spki", miClavePublica);
var pubBase64 = btoa(String.fromCharCode.apply(null, new Uint8Array(pubExp)));
var privExp = await crypto.subtle.exportKey("pkcs8", miClavePrivada);
var privBase64 = btoa(String.fromCharCode.apply(null, new Uint8Array(privExp)));
var pinTemporal = pinActualTemporal || sessionStorage.getItem('pin_temporal_' + miPIN);
var aGuardar = (pinAccesoHash && pinTemporal) ? await cifrarClaveConPIN(privBase64, pinTemporal) : ofuscarClave(privBase64);
localStorage.setItem('clave_privada_' + miPIN, aGuardar);
await subirClavePublica(pubBase64);
} catch (error) { logError('Error:', error); }
}
async function subirClavePublica(pubBase64) {
if (!clienteSupabase) return;
await clienteSupabase.from('usuarios').upsert({ pin: miPIN, clave_publica: pubBase64 });
}

} catch (error) { return null; }
}

async function generarClaveAES() { return await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]); }

}
async function descifrarConAES(ivBase64, datosBase64, claveAES) {

var datos = Uint8Array.from(atob(datosBase64), c => c.charCodeAt(0));
return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, claveAES, datos));
}
async function exportarClaveAES(clave) { return btoa(String.fromCharCode.apply(null, new Uint8Array(await crypto.subtle.exportKey("raw", clave)))); }
async function importarClaveAES(base64) { return await crypto.subtle.importKey("raw", Uint8Array.from(atob(base64), c => c.charCodeAt(0)), { name: "AES-GCM" }, true, ["encrypt", "decrypt"]); }

}

}

}

iv: archivoCifrado.iv,

claveParaMi: archivoCifrado.claveParaMi,
cifrado: true
};
} catch (error) {
logError('❌ Error en subirArchivo:', error);
throw error;
}
}

// Descarga, descifra al vuelo y renderiza el adjunto seguro usando Blob URLs locales
async function cargarYDescifrarAdjunto(msg) {
var container = document.getElementById('media-container-' + msg.id);
if (!container) return;
if (container.getAttribute('data-loaded') === 'true') return;
try {
var path = obtenerPathDesdeUrl(msg.archivo_url) || msg.archivo_url;
if (!path) { container.innerHTML = '<span style="color: #ff3b30; font-size: 11px;">⚠️ Error: Ruta no válida</span>'; return; }
log('📥 Descargando adjunto para descifrar: ' + path);
var { data: blob, error } = await clienteSupabase.storage.from('chat-files').download(path);
if (error) {
log('⚠️ Error de descarga directa, solicitando nueva URL firmada...');
var { data: signedData, error: signedError } = await clienteSupabase.storage.from('chat-files').createSignedUrl(path, 300);
if (signedError || !signedData) throw new Error('No se pudo descargar el archivo del storage.');
var resp = await fetch(signedData.signedUrl);
blob = await resp.blob();
}
if (!blob) throw new Error('Archivo vacío en el servidor.');
var decryptedBlob;
if (msg.archivo_cifrado) {
log('🔐 Descifrando adjunto: ' + msg.archivo_nombre);
var arrayBuffer = await blob.arrayBuffer();
var iv = msg.archivo_iv;
var claveCifrada = msg.archivo_clave;
var claveCifradaDest = msg.archivo_clave_destinatario;
var decryptedBuffer = await descifrarArchivo(arrayBuffer, iv, claveCifrada, claveCifradaDest);
var tipoMime = msg.tipoOriginal || (msg.tipo_mensaje === 'imagen' ? 'image/*' : msg.tipo_mensaje === 'video' ? 'video/*' : 'application/octet-stream');
decryptedBlob = new Blob([decryptedBuffer], { type: tipoMime });
} else {
decryptedBlob = blob;
}
var objectUrl = URL.createObjectURL(decryptedBlob);
container.setAttribute('data-loaded', 'true');
if (msg.tipo_mensaje === 'imagen') {
container.innerHTML = '<img src="' + objectUrl + '" style="max-width: 220px; border-radius: 8px; margin-top: 4px;" onclick="window.open(\'' + objectUrl + '\')">';
} else if (msg.tipo_mensaje === 'video') {
container.innerHTML = '<video controls style="max-width: 220px; border-radius: 8px; margin-top: 4px;"><source src="' + objectUrl + '"></video>';
} else if (msg.tipo_mensaje === 'documento' || msg.tipo_mensaje === 'archivo') {
var tamStr = msg.archivo_tamaño ? ' (' + formatBytes(msg.archivo_tamaño) + ')' : '';
container.innerHTML = '<a href="' + objectUrl + '" download="' + (msg.archivo_nombre || 'archivo') + '" style="color: #00ff88; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; background: rgba(0,255,136,0.1); border: 1px solid rgba(0,255,136,0.2); border-radius: 6px; margin-top: 4px;">📎 ' + (msg.archivo_nombre || 'Descargar') + tamStr + '</a>';
} else {
container.innerHTML = '<a href="' + objectUrl + '" download="' + (msg.archivo_nombre || 'archivo') + '">📎 Descargar</a>';
}
} catch (err) {
logError('❌ Error descifrando adjunto:', err);
container.innerHTML = '<span style="color: #ff3b30; font-size: 11px;">⚠️ Error al descifrar archivo</span>';
}
}

async function verificarEstado() {
var estadoDiv = document.getElementById('estadoTexto');
var form = document.getElementById('formActivacion');
var chat = document.getElementById('panelChat');
if (!clienteSupabase) { estadoDiv.innerText = '⚠️ Sin conexión'; form.classList.remove('hidden'); return; }
try {
var { data } = await clienteSupabase.from('usuarios').select('fecha_expiracion').eq('pin', miPIN).maybeSingle();
if (data && data.fecha_expiracion && new Date(data.fecha_expiracion) > new Date()) {
estadoDiv.className = 'status active';
estadoDiv.innerText = '✅ Servicio Activo';
form.classList.add('hidden');
chat.classList.remove('hidden');
document.getElementById('fechaVencimiento').innerText = new Date(data.fecha_expiracion).toLocaleDateString('es-ES');
return;
}
estadoDiv.className = 'status expired';
estadoDiv.innerText = '⚠️ Servicio Inactivo';
form.classList.remove('hidden');
chat.classList.add('hidden');
} catch (error) { estadoDiv.innerText = '❌ Error'; form.classList.remove('hidden'); }
}

// ENVIAR MENSAJE
// ============================================
async function enviarMensaje() {
if (!puedeEnviar()) return;
var texto = document.getElementById('nuevoMensaje').value.trim();
if (!texto && !archivoSeleccionado) { alert('Escribe algo'); return; }
var contenedor = document.getElementById('chatMensajes');
var tipoMensaje = 'texto';
var archivoInfo = null;
var mensajeCifrado = '';
if (texto) {
var clavePub = await obtenerClavePublica(contactoActual);
if (!clavePub) { alert('⚠️ Sin cifrado'); return; }
try { mensajeCifrado = await cifrarMensaje(texto, clavePub); } catch (error) { alert('Error cifrado'); return; }
}
if (archivoSeleccionado) {
try {
log('📎 Procesando archivo: ' + archivoSeleccionado.name);
document.getElementById('archivoProgressBar').style.width = '30%';
archivoInfo = await subirArchivo(archivoSeleccionado, contactoActual);
log('✅ Archivo subido exitosamente:', archivoInfo);
document.getElementById('archivoProgressBar').style.width = '100%';
var tipo = archivoInfo.tipo.split('/')[0];
if (tipo === 'image') tipoMensaje = 'imagen';
else if (tipo === 'video') tipoMensaje = 'video';
else tipoMensaje = 'documento';
setTimeout(function() { document.getElementById('archivoProgressBar').style.width = '0%'; }, 500);
} catch (error) {
logError('❌ Error al subir archivo:', error);
alert('Error al subir archivo: ' + error.message);
document.getElementById('archivoProgressBar').style.width = '0%';
return;
}
}
var tempId = 'temp-' + Date.now();
var mensajeTemp = {
id: tempId,
pin_remitente: miPIN,
pin_destinatario: contactoActual,
tipo_mensaje: tipoMensaje,
archivo_url: archivoInfo ? archivoInfo.url : null,
archivo_nombre: archivoInfo ? archivoInfo.nombre : null,
archivo_tamaño: archivoInfo ? archivoInfo.tamaño : null,
archivo_iv: archivoInfo ? archivoInfo.iv : null,
archivo_clave: archivoInfo ? archivoInfo.claveParaMi : null,
archivo_clave_destinatario: archivoInfo ? archivoInfo.claveParaDestinatario : null,
archivo_cifrado: archivoInfo ? archivoInfo.cifrado : false,
texto_descifrado: texto,
enviado_en: new Date().toISOString(),
leido: false
};
var sinMensajes = contenedor.querySelector('p');
if (sinMensajes) contenedor.innerHTML = '';
var divTemp = document.createElement('div');
divTemp.className = 'mensaje mensaje-enviado';
divTemp.setAttribute('data-id', tempId);
divTemp.innerHTML = construirContenidoMensaje(mensajeTemp) + '<div class="mensaje-meta"><span>✓</span></div>';
contenedor.appendChild(divTemp);
contenedor.scrollTop = contenedor.scrollHeight;
if (archivoSeleccionado && archivoInfo) {
var localContainer = document.getElementById('media-container-' + tempId);
if (localContainer) {
var localUrl = URL.createObjectURL(archivoSeleccionado);
localContainer.setAttribute('data-loaded', 'true');
if (tipoMensaje === 'imagen') {
localContainer.innerHTML = '<img src="' + localUrl + '" style="max-width: 220px; border-radius: 8px; margin-top: 4px;">';
} else if (tipoMensaje === 'video') {
localContainer.innerHTML = '<video controls style="max-width: 220px; border-radius: 8px; margin-top: 4px;"><source src="' + localUrl + '"></video>';
} else {
localContainer.innerHTML = '<a href="' + localUrl + '" download="' + archivoInfo.nombre + '" style="color: #00ff88; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; background: rgba(0,255,136,0.1); border: 1px solid rgba(0,255,136,0.2); border-radius: 6px; margin-top: 4px;">📎 ' + archivoInfo.nombre + '</a>';
}
}
}
try {
var { error } = await clienteSupabase.from('mensajes').insert({
pin_remitente: miPIN,
pin_destinatario: contactoActual,
mensaje_cifrado: mensajeCifrado,
nonce: 'e2ee',
tipo_mensaje: tipoMensaje,
archivo_url: archivoInfo ? archivoInfo.url : null,
archivo_nombre: archivoInfo ? archivoInfo.nombre : null,
archivo_tamaño: archivoInfo ? archivoInfo.tamaño : null,
archivo_iv: archivoInfo ? archivoInfo.iv : null,
archivo_clave: archivoInfo ? archivoInfo.claveParaMi : null,
archivo_clave_destinatario: archivoInfo ? archivoInfo.claveParaDestinatario : null,
archivo_cifrado: archivoInfo ? archivoInfo.cifrado : false,
leido: false
});
if (error) throw error;
document.getElementById('nuevoMensaje').value = '';
cancelarArchivo();
cargarMensajes();
} catch (error) {
alert('Error: ' + error.message);
divTemp.style.opacity = '0.5';
}
}
function construirContenidoMensaje(msg) {
log('📝 Construyendo contenedor para mensaje: ' + msg.id);
var contenido = '';
if (msg.archivo_url) {
contenido = '<div id="media-container-' + msg.id + '" class="media-container" data-loaded="false">';
contenido += '<span class="loading-media">🔐 Descifrando adjunto...</span>';
contenido += '</div>';
}
if (msg.texto_descifrado) {
var textoEscapado = escapeHtml(msg.texto_descifrado);
if (contenido) contenido = '<div style="margin-bottom: 4px;">' + textoEscapado + '</div>' + contenido;
else contenido = textoEscapado;
}
if (!contenido) contenido = '<em style="color: #888;">[Archivo]</em>';
return contenido;
}
async function marcarComoLeidos() {
if (!contactoActual || !clienteSupabase) return;
try {
await clienteSupabase.from('mensajes').update({ leido: true, leido_en: new Date().toISOString() }).eq('pin_remitente', contactoActual).eq('pin_destinatario', miPIN).eq('leido', false);
delete mensajesNoLeidos[contactoActual];
} catch (error) { logError('Error:', error); }
}
async function cargarMensajes() {
try {
var { data, error } = await clienteSupabase.from('mensajes').select('*').or('and(pin_remitente.eq.' + miPIN + ',pin_destinatario.eq.' + contactoActual + '),and(pin_remitente.eq.' + contactoActual + ',pin_destinatario.eq.' + miPIN + ')').order('enviado_en', { ascending: true });
if (error) throw error;
var contenedor = document.getElementById('chatMensajes');
if (!data || data.length === 0) { contenedor.innerHTML = '<p style="color: #888; text-align: center; padding: 20px;">No hay mensajes aún</p>'; return; }
var mensajes = [];
for (var msg of data) {
var texto = '';
if (msg.mensaje_cifrado && msg.mensaje_cifrado.length > 0) texto = await descifrarMensaje(msg.mensaje_cifrado);
mensajes.push({ ...msg, texto_descifrado: texto });
}
var html = '';
mensajes.forEach(function(msg) {
var esMio = msg.pin_remitente === miPIN;
var clase = esMio ? 'mensaje-enviado' : 'mensaje-recibido';
if (mensajesSeleccionados.includes(String(msg.id))) clase += ' seleccionado';
var checks = esMio ? (msg.leido ? '<span class="check-leido">✓✓</span>' : '<span>✓</span>') : '';
var onclickAttr = modoSeleccion ? 'onclick="toggleSeleccion(\'' + msg.id + '\')"' : 'oncontextmenu="mostrarMenuMensaje(event, \'' + msg.id + '\')"';
html += '<div class="mensaje ' + clase + '" data-id="' + msg.id + '" ' + onclickAttr + '>' + construirContenidoMensaje(msg) + '<div class="mensaje-meta">' + checks + '</div></div>';
});
contenedor.innerHTML = html;
contenedor.scrollTop = contenedor.scrollHeight;
mensajes.forEach(function(msg) {
if (msg.archivo_url) { cargarYDescifrarAdjunto(msg); }
});
} catch (error) { logError('Error cargando mensajes:', error); }
}
function suscribirseAMensajes() {
if (!clienteSupabase) return;
cancelarSuscripciones();
canalRealtime = clienteSupabase.channel('mensajes_' + miPIN)
.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes', filter: 'pin_destinatario=eq.' + miPIN }, async function(payload) {
var nuevo = payload.new;
if (getBloqueados().includes(nuevo.pin_remitente)) return;
if (modoPrivado && !getContactos().includes(nuevo.pin_remitente)) return;
var texto = '';
if (nuevo.mensaje_cifrado && nuevo.mensaje_cifrado.length > 0) texto = await descifrarMensaje(nuevo.mensaje_cifrado);
mensajesNoLeidos[nuevo.pin_remitente] = (mensajesNoLeidos[nuevo.pin_remitente] || 0) + 1;
if (contactoActual === nuevo.pin_remitente) {
nuevo.texto_descifrado = texto;
var contenedor = document.getElementById('chatMensajes');
var sinMensajes = contenedor.querySelector('p');
if (sinMensajes) contenedor.innerHTML = '';
var div = document.createElement('div');
div.className = 'mensaje mensaje-recibido';
div.setAttribute('data-id', nuevo.id);
div.innerHTML = construirContenidoMensaje(nuevo);
contenedor.appendChild(div);
contenedor.scrollTop = contenedor.scrollHeight;
if (nuevo.archivo_url) { cargarYDescifrarAdjunto(nuevo); }
setTimeout(marcarComoLeidos, 1000);
} else { cargarContactos(); cargarMensajesPendientes(); }
})
.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'mensajes', filter: 'pin_remitente=eq.' + miPIN }, function(payload) {
if (payload.new.leido) {
document.querySelectorAll('.mensaje-enviado .mensaje-meta span:not(.check-leido)').forEach(function(span) {
if (span.innerText === '✓') { span.className = 'check-leido'; span.innerText = '✓✓'; }
});
}
})
.on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'mensajes' }, function(payload) {
if (contactoActual) cargarMensajes();
})
.subscribe();
}
function cancelarSuscripciones() { if (canalRealtime) { clienteSupabase.removeChannel(canalRealtime); canalRealtime = null; } }
document.addEventListener('click', function(e) {
if (!e.target.closest('.menu-contextual') && !e.target.closest('.contacto-menu-btn') && !e.target.closest('.btn-warning') && !e.target.closest('.btn-info') && !e.target.closest('.btn-secondary')) cerrarMenus();
});
